<header class="homey-header">
  <p id="credentials-subtitle" class="homey-subtitle"></p>
</header>

<form id="credentials-pairing-form" class="homey-form">
  <fieldset class="homey-form-fieldset">
    <legend id="credentials-legend" class="homey-form-legend"></legend>

    <div class="homey-form-group">
      <label id="credentials-username-label" class="homey-form-label" for="credentials-username"></label>
      <input
        class="homey-form-input"
        id="credentials-username"
        type="text"
        autocomplete="username"
        autocapitalize="off"
        spellcheck="false"
        value=""
      />
    </div>

    <div class="homey-form-group">
      <label id="credentials-password-label" class="homey-form-label" for="credentials-password"></label>
      <input
        class="homey-form-input"
        id="credentials-password"
        type="password"
        autocomplete="current-password"
        value=""
      />
    </div>
  </fieldset>

  <button id="add-authenticated-device" class="homey-button-primary-full" type="submit"></button>
</form>

<section id="credentials-pairing-result" hidden="hidden">
  <p id="credentials-pairing-status"></p>
</section>

<script type="text/javascript">
  Homey.setTitle(Homey.__('pair.credentials.title'));

  document.getElementById('credentials-subtitle').textContent = Homey.__('pair.credentials.subtitle');
  document.getElementById('credentials-legend').textContent = Homey.__('pair.credentials.legend');
  document.getElementById('credentials-username-label').textContent = Homey.__('pair.credentials.usernameLabel');
  document.getElementById('credentials-password-label').textContent = Homey.__('pair.credentials.passwordLabel');

  var form = document.getElementById('credentials-pairing-form');
  var usernameInput = document.getElementById('credentials-username');
  var passwordInput = document.getElementById('credentials-password');
  var addButton = document.getElementById('add-authenticated-device');
  var addButtonDefaultText = Homey.__('pair.credentials.addButton');
  var resultSection = document.getElementById('credentials-pairing-result');
  var statusText = document.getElementById('credentials-pairing-status');

  addButton.textContent = addButtonDefaultText;

  function setBusy(isBusy) {
    addButton.disabled = isBusy;

    if (isBusy) {
      addButton.textContent = Homey.__('pair.credentials.addingButton');
      addButton.classList.add('is-loading');
    } else {
      addButton.textContent = addButtonDefaultText;
      addButton.classList.remove('is-loading');
    }
  }

  function showMessage(message) {
    resultSection.hidden = false;
    statusText.textContent = message;
  }

  function emitHomey(eventName, payload) {
    return new Promise(function (resolve, reject) {
      try {
        var emitResult = Homey.emit(eventName, payload, function (error, result) {
          if (error) {
            reject(error);
            return;
          }

          resolve(result);
        });

        if (emitResult && typeof emitResult.then === 'function') {
          emitResult.then(resolve).catch(reject);
        } else if (emitResult && typeof emitResult.catch === 'function') {
          emitResult.catch(reject);
        }
      } catch (error) {
        reject(error);
      }
    });
  }

  function createHomeyDevice(device) {
    return new Promise(function (resolve, reject) {
      try {
        var createResult = Homey.createDevice(device, function (error, result) {
          if (error) {
            reject(error);
            return;
          }

          resolve(result);
        });

        if (createResult && typeof createResult.then === 'function') {
          createResult.then(resolve).catch(reject);
        } else if (createResult && typeof createResult.catch === 'function') {
          createResult.catch(reject);
        }
      } catch (error) {
        reject(error);
      }
    });
  }

  function getFormData() {
    var username = usernameInput.value.trim();
    var password = passwordInput.value;

    if (!username || !password) {
      throw new Error(Homey.__('pair.credentials.errors.required'));
    }

    return {
      username: username,
      password: password,
    };
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();

    var payload;

    try {
      payload = getFormData();
    } catch (error) {
      Homey.alert(error.message || String(error));
      return;
    }

    setBusy(true);
    resultSection.hidden = true;
    statusText.textContent = '';

    emitHomey('credentials_pairing_add', payload)
      .then(function (result) {
        if (result.status === 'detected') {
          return createHomeyDevice(result.device)
            .then(function () {
              Homey.done();
            });
        }

        if (result.status === 'auth-required') {
          Homey.alert(Homey.__('pair.credentials.errors.invalid'));
          return undefined;
        }

        if (result.status === 'rejected') {
          showMessage(Homey.__('pair.credentials.errors.notSupported'));
          return undefined;
        }

        showMessage(Homey.__('pair.credentials.errors.notReachable'));
        return undefined;
      })
      .catch(function (error) {
        Homey.alert(error.message || String(error));
      })
      .then(function () {
        setBusy(false);
      });
  });
</script>
