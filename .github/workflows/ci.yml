name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Must run before the tests: `npm run build` is plain tsc, while the bundled icon
      # tests read the asset files that only `homey app build` copies into .homeybuild.
      # It also regenerates app.json from .homeycompose. Both homey steps were verified
      # to run headless without an App Store login, so they are blocking.
      - name: Homey app build
        run: npx --yes homey@4.6.0 app build

      - name: app.json is in sync with .homeycompose
        run: git diff --exit-code app.json

      - name: Test
        run: node --test test/*.test.js

      - name: Lint
        run: npm run lint

      - name: Homey publish-level validation
        run: npx --yes homey@4.6.0 app validate --level publish

      # Report only (decision P3): a new advisory must not block the pipeline.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
        continue-on-error: true
